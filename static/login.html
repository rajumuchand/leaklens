<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeakLens — Firebase Google Sign-In</title>
    <meta name="theme-color" content="#06060A" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #06060A;
            --surface: rgba(14, 15, 24, 0.88);
            --border: rgba(243, 242, 248, 0.12);
            --text: #F3F2F8;
            --muted: #9B99AD;
            --teal: #2BD8C8;
            --violet: #7B5CFA;
            --gold: #FFB627;
            --danger: #FF6B84;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --display: 'Space Grotesk', 'Inter', sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 18%, rgba(123, 92, 250, 0.22), transparent 44%),
                        radial-gradient(circle at 82% 82%, rgba(43, 216, 200, 0.16), transparent 45%),
                        var(--bg);
            color: var(--text);
            font-family: var(--sans);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--display);
            font-weight: 700;
            font-size: 20px;
            color: var(--text);
            text-decoration: none;
        }
        .badge {
            font-family: var(--mono);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(43, 216, 200, 0.35);
            color: var(--teal);
            background: rgba(43, 216, 200, 0.08);
        }
        h1 {
            margin: 0;
            font-family: var(--display);
            font-size: 26px;
            letter-spacing: -0.02em;
        }
        p.sub {
            margin: 0;
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--muted);
        }
        .google-btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 13px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: #FFFFFF;
            color: #11131A;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .google-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(123, 92, 250, 0.28);
        }
        .google-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        label {
            display: block;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input {
            width: 100%;
            padding: 11px 13px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(6, 6, 10, 0.72);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: var(--teal); }
        .row-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn.teal { background: rgba(43, 216, 200, 0.16); border-color: rgba(43, 216, 200, 0.45); color: #9FF6EE; }
        .btn.gold { background: rgba(255, 182, 39, 0.14); border-color: rgba(255, 182, 39, 0.45); color: #FFD67A; }
        .status-msg {
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.45;
            min-height: 18px;
            color: var(--muted);
            word-break: break-word;
        }
        .existing-session {
            display: none;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(43, 216, 200, 0.35);
            background: rgba(43, 216, 200, 0.08);
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <main class="login-card" aria-label="LeakLens Firebase Authentication">
        <div class="brand-row">
            <a href="/" class="brand">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <defs>
                        <linearGradient id="llgrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#FFB627" />
                            <stop offset="0.55" stop-color="#9A82FF" />
                            <stop offset="1" stop-color="#2BD8C8" />
                        </linearGradient>
                    </defs>
                    <path d="M12 2.5 L21.5 19.5 L2.5 19.5 Z" fill="url(#llgrad)" opacity="0.92" />
                    <path d="M12 2.5 L13.6 14.2 M21.5 19.5 L13.6 14.2 M2.5 19.5 L13.6 14.2" stroke="#000" stroke-opacity="0.55" stroke-width="1.3" />
                </svg>
                <span>LeakLens</span>
            </a>
            <span class="badge">FIREBASE AUTH · CLOUD</span>
        </div>

        <div>
            <h1>Sign in to LeakLens</h1>
            <p class="sub" style="margin-top:6px;">
                Authenticate directly with Google via Firebase Authentication — zero local tunnels required.
            </p>
        </div>

        <div id="existingSessionBox" class="existing-session">
            <div style="font-size:12.5px; color:#9FF6EE;">
                Signed in as <strong id="existingEmail"></strong>
            </div>
            <div class="row-actions">
                <button type="button" id="continueExistingBtn" class="btn teal">Open LeakLens →</button>
                <button type="button" id="switchAccountBtn" class="btn">Switch Account</button>
            </div>
        </div>

        <button type="button" id="googleSignInBtn" class="google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
                <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
            </svg>
            <span>Continue with Google</span>
        </button>

        <div class="divider">OR SIGN IN WITH EMAIL</div>

        <div>
            <label for="fbEmail">Work Email</label>
            <input id="fbEmail" type="email" placeholder="operator@company.com" autocomplete="email" />
        </div>

        <div>
            <label for="fbPassword">Password</label>
            <input id="fbPassword" type="password" placeholder="Minimum 6 characters" autocomplete="current-password" />
        </div>

        <div class="row-actions">
            <button type="button" id="emailSignInBtn" class="btn teal">Sign In</button>
            <button type="button" id="emailSignUpBtn" class="btn gold">Create Account</button>
        </div>

        <div id="authStatus" class="status-msg">Ready for Firebase Google Authentication.</div>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js';
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signInWithRedirect,
            getRedirectResult,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyBpyT_htz0GZaIo0cRwYvosZmBRMKYp9sY',
            authDomain: 'leaklens-77637.firebaseapp.com',
            projectId: 'leaklens-77637',
            storageBucket: 'leaklens-77637.firebasestorage.app',
            messagingSenderId: '279675539046',
            appId: '1:279675539046:web:13ce79ad629d45972367a7',
            measurementId: 'G-E7PW3Q5NHD'
        };

        const CLOUD_BACKEND_ORIGIN = 'https://leaklens-tyrn.vercel.app';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        const params = new URLSearchParams(window.location.search);
        const loggedOut = params.get('logged_out') === '1';

        function getSafeRedirectTarget() {
            const raw = (params.get('redirect') || '').trim();
            if (!raw) return `${window.location.origin}/`;
            try {
                const parsed = new URL(raw, window.location.origin);
                if (
                    parsed.origin === window.location.origin ||
                    parsed.hostname.endsWith('.web.app') ||
                    parsed.hostname.endsWith('.firebaseapp.com') ||
                    parsed.hostname.endsWith('.vercel.app')
                ) {
                    return parsed.toString();
                }
            } catch {}
            return `${window.location.origin}/`;
        }

        function resolveBackendUrl(path) {
            if (window.location.hostname.endsWith('.vercel.app')) return path;
            return `${CLOUD_BACKEND_ORIGIN}${path}`;
        }

        function setStatus(msg, color) {
            const el = document.getElementById('authStatus');
            if (!el) return;
            el.style.color = color || 'var(--muted)';
            el.textContent = msg;
        }

        async function completeFirebaseSession(firebaseUser) {
            if (!firebaseUser) return;
            setStatus(`Verified ${firebaseUser.email}. Opening LeakLens...`, 'var(--teal)');
            const idToken = await firebaseUser.getIdToken(true);
            let sessionToken = idToken;
            const userProfile = {
                email: firebaseUser.email || '',
                name: firebaseUser.displayName || (firebaseUser.email || '').split('@')[0] || 'Operator',
                picture: firebaseUser.photoURL || ''
            };

            try {
                const resp = await fetch(resolveBackendUrl('/api/auth/firebase'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_token: idToken })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    if (data?.access_token) sessionToken = data.access_token;
                    if (data?.user?.email) userProfile.email = data.user.email;
                    if (data?.user?.name) userProfile.name = data.user.name;
                    if (data?.user?.picture) userProfile.picture = data.user.picture;
                }
            } catch {
                // Keep verified Firebase ID token as session token
            }

            localStorage.setItem('firebase_id_token', idToken);
            localStorage.setItem('access_token', sessionToken);
            localStorage.setItem('user_email', userProfile.email);
            localStorage.setItem('user_name', userProfile.name);
            if (userProfile.picture) localStorage.setItem('user_picture', userProfile.picture);

            const targetUrl = new URL(getSafeRedirectTarget());
            if (targetUrl.origin !== window.location.origin) {
                targetUrl.searchParams.set('token', sessionToken);
                if (userProfile.email) targetUrl.searchParams.set('email', userProfile.email);
            }
            window.location.replace(targetUrl.toString());
        }

        async function handleGoogleLogin() {
            const btn = document.getElementById('googleSignInBtn');
            if (btn) btn.disabled = true;
            setStatus('Opening Google Sign-In via Firebase...', 'var(--muted)');
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await completeFirebaseSession(result.user);
            } catch (err) {
                const code = err?.code || '';
                if (
                    code === 'auth/popup-blocked' ||
                    code === 'auth/operation-not-supported-in-this-environment'
                ) {
                    setStatus('Popup blocked — redirecting to Google Sign-In...', 'var(--gold)');
                    await signInWithRedirect(auth, googleProvider);
                    return;
                }
                if (code === 'auth/unauthorized-domain') {
                    setStatus(
                        `Domain ${window.location.hostname} is not authorized in Firebase Console -> Authentication -> Settings -> Authorized domains.`,
                        'var(--danger)'
                    );
                } else if (code !== 'auth/popup-closed-by-user') {
                    setStatus(err?.message || 'Google authentication failed.', 'var(--danger)');
                } else {
                    setStatus('Sign-in cancelled.', 'var(--muted)');
                }
                if (btn) btn.disabled = false;
            }
        }

        async function handleEmailAuth(mode) {
            const email = (document.getElementById('fbEmail')?.value || '').trim();
            const password = document.getElementById('fbPassword')?.value || '';
            if (!email || password.length < 6) {
                setStatus('Enter a valid email and password (min 6 characters).', 'var(--danger)');
                return;
            }
            setStatus(mode === 'signup' ? 'Creating Firebase account...' : 'Signing in via Firebase...', 'var(--muted)');
            try {
                const cred =
                    mode === 'signup'
                        ? await createUserWithEmailAndPassword(auth, email, password)
                        : await signInWithEmailAndPassword(auth, email, password);
                await completeFirebaseSession(cred.user);
            } catch (err) {
                setStatus(err?.message || 'Firebase authentication failed.', 'var(--danger)');
            }
        }

        document.getElementById('googleSignInBtn')?.addEventListener('click', handleGoogleLogin);
        document.getElementById('emailSignInBtn')?.addEventListener('click', () => handleEmailAuth('signin'));
        document.getElementById('emailSignUpBtn')?.addEventListener('click', () => handleEmailAuth('signup'));

        (async function bootstrapAuth() {
            const hash = window.location.hash || '';
            const hashMatch = hash.match(/access_token=([^&]+)/);
            const urlToken = params.get('token') || (hashMatch && hashMatch[1] ? decodeURIComponent(hashMatch[1]) : null);
            if (urlToken) {
                localStorage.setItem('access_token', urlToken);
                if (params.get('email')) localStorage.setItem('user_email', params.get('email'));
                window.location.replace(getSafeRedirectTarget());
                return;
            }

            if (loggedOut) {
                await signOut(auth).catch(() => {});
                try {
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch {}
                setStatus('Signed out cleanly. Sign in with Google below.', 'var(--muted)');
                return;
            }

            try {
                const redirectResult = await getRedirectResult(auth);
                if (redirectResult?.user) {
                    await completeFirebaseSession(redirectResult.user);
                    return;
                }
            } catch (err) {
                setStatus(err?.message || 'Google redirect sign-in failed.', 'var(--danger)');
            }

            onAuthStateChanged(auth, (currentUser) => {
                const box = document.getElementById('existingSessionBox');
                const emailEl = document.getElementById('existingEmail');
                if (currentUser && box && emailEl) {
                    emailEl.textContent = currentUser.email || currentUser.displayName || 'Authenticated User';
                    box.style.display = 'flex';
                    document.getElementById('continueExistingBtn').onclick = () => completeFirebaseSession(currentUser);
                    document.getElementById('switchAccountBtn').onclick = async () => {
                        await signOut(auth);
                        box.style.display = 'none';
                        setStatus('Signed out. Choose an account below.', 'var(--muted)');
                    };
                }
            });
        })();
    </script>
</body>
</html>
