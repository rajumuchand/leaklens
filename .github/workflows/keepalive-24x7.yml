name: LeakLens 24x7 Cloud & Firebase Keepalive

on:
  schedule:
    # Runs every 6 hours 24/7 on GitHub Cloud runners (independent of local machine)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Vercel FastAPI + Firebase Health
        run: |
          set -euo pipefail
          HEALTH=$(curl -fsS --retry 3 "https://leaklens-tyrn.vercel.app/api/health")
          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"online"'

      - name: Verify Confidential Documents Endpoint
        run: |
          set -euo pipefail
          DOCS=$(curl -fsS --retry 3 "https://leaklens-tyrn.vercel.app/api/documents")
          echo "$DOCS" | grep -q 'helios-brief'

      - name: Verify Firebase Hosting Login Endpoint
        run: |
          set -euo pipefail
          curl -fsS --retry 3 "https://leaklens-77637.web.app/login" | grep -q "leaklens-77637"
