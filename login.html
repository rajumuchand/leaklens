<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeakLens — Login</title>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            color: #FFFFFF;
            font-family: 'Instrument Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }
        #framerLoginFrame {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            background: #000000;
            z-index: 1;
        }
        /* Desktop / Laptop layout: opaque cover over Framer's right text/button column beside the 3D cube */
        .login-panel {
            position: fixed;
            top: 52%;
            right: clamp(24px, 5vw, 72px);
            transform: translateY(-50%);
            width: clamp(310px, 34vw, 390px);
            min-height: 270px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 14px;
            padding: 28px 24px;
            border-radius: 20px;
            background: #000000;
            box-shadow: 0 0 60px 44px #000000;
        }
        .login-title {
            margin: 0;
            font-size: 32px;
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.02em;
            color: #FFFFFF;
        }
        .login-subtitle {
            margin: 0;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.68);
        }
        .google-btn {
            width: 100%;
            height: 46px;
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: #FFFFFF;
            color: #11131A;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .google-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(87, 90, 255, 0.36);
        }
        .google-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .auth-error {
            display: none;
            font-size: 12px;
            color: #FF6B84;
            line-height: 1.4;
        }
        /* Mobile layout: separate card anchored below the top 3D cube */
        @media (max-width: 809.98px) {
            .login-panel {
                top: auto;
                bottom: 20px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: calc(100vw - 28px);
                max-width: 390px;
                min-height: auto;
                align-items: center;
                text-align: center;
                padding: 24px 20px;
                border-radius: 22px;
                background: #06060C;
                border: 1px solid rgba(255, 255, 255, 0.14);
                box-shadow: 0 0 60px 36px #000000;
                gap: 12px;
            }
            .login-title {
                font-size: 24px;
            }
            .login-subtitle {
                font-size: 13.5px;
            }
        }
    </style>
</head>
<body>
    <iframe
        id="framerLoginFrame"
        title="LeakLens Login"
        src="https://courageous-audience-435078.framer.app/"
        allow="identity-credentials-get; clipboard-read; clipboard-write"
    ></iframe>

    <div class="login-panel">
        <h2 class="login-title">Welcome to LeakLens</h2>
        <p class="login-subtitle">Your next step starts here. Log in or create an account with Google.</p>
        <button type="button" id="googleSignInBtn" class="google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
                <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
            </svg>
            <span>Sign in with Google</span>
        </button>
        <div id="authError" class="auth-error"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js';
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signInWithRedirect,
            getRedirectResult,
            signOut
        } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyBpyT_htz0GZaIo0cRwYvosZmBRMKYp9sY',
            authDomain: 'leaklens-77637.firebaseapp.com',
            projectId: 'leaklens-77637',
            storageBucket: 'leaklens-77637.firebasestorage.app',
            messagingSenderId: '279675539046',
            appId: '1:279675539046:web:13ce79ad629d45972367a7',
            measurementId: 'G-E7PW3Q5NHD'
        };

        const FRAMER_LOGIN_URL = 'https://courageous-audience-435078.framer.app/';
        const FIREBASE_HOSTING_LOGIN = 'https://leaklens-77637.web.app/login';
        const CLOUD_BACKEND_ORIGIN = 'https://leaklens-tyrn.vercel.app';

        // Always execute Firebase Google Sign-In on the authorized Firebase Hosting domain
        const currentHost = window.location.hostname || '';
        const isAuthorizedFirebaseHost =
            currentHost.endsWith('.web.app') || currentHost.endsWith('.firebaseapp.com');
        if (!isAuthorizedFirebaseHost) {
            const fwdParams = new URLSearchParams(window.location.search);
            if (!fwdParams.get('redirect')) {
                fwdParams.set('redirect', `${window.location.origin}/`);
            }
            window.location.replace(`${FIREBASE_HOSTING_LOGIN}?${fwdParams.toString()}`);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        const params = new URLSearchParams(window.location.search);
        const loggedOut = params.get('logged_out') === '1';

        function getSafeRedirectTarget() {
            const raw = (params.get('redirect') || '').trim();
            if (!raw) return `${window.location.origin}/`;
            try {
                const parsed = new URL(raw, window.location.origin);
                if (
                    parsed.origin === window.location.origin ||
                    parsed.hostname.endsWith('.web.app') ||
                    parsed.hostname.endsWith('.firebaseapp.com') ||
                    parsed.hostname.endsWith('.vercel.app')
                ) {
                    return parsed.toString();
                }
            } catch {}
            return `${window.location.origin}/`;
        }

        const framerFrame = document.getElementById('framerLoginFrame');
        if (framerFrame) {
            framerFrame.src = `${FRAMER_LOGIN_URL}?redirect=${encodeURIComponent(getSafeRedirectTarget())}`;
        }

        function resolveBackendUrl(path) {
            if (window.location.hostname.endsWith('.vercel.app')) return path;
            return `${CLOUD_BACKEND_ORIGIN}${path}`;
        }

        function showError(msg) {
            const el = document.getElementById('authError');
            if (!el) return;
            if (!msg) {
                el.style.display = 'none';
                el.textContent = '';
                return;
            }
            el.style.display = 'block';
            el.textContent = msg;
        }

        async function completeFirebaseSession(firebaseUser) {
            if (!firebaseUser) return;
            const idToken = await firebaseUser.getIdToken(true);
            let sessionToken = idToken;
            const userProfile = {
                email: firebaseUser.email || '',
                name: firebaseUser.displayName || (firebaseUser.email || '').split('@')[0] || 'Operator',
                picture: firebaseUser.photoURL || ''
            };

            try {
                const resp = await fetch(resolveBackendUrl('/api/auth/firebase'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_token: idToken })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    if (data?.access_token) sessionToken = data.access_token;
                    if (data?.user?.email) userProfile.email = data.user.email;
                    if (data?.user?.name) userProfile.name = data.user.name;
                    if (data?.user?.picture) userProfile.picture = data.user.picture;
                }
            } catch {}

            localStorage.setItem('firebase_id_token', idToken);
            localStorage.setItem('access_token', sessionToken);
            localStorage.setItem('user_email', userProfile.email);
            localStorage.setItem('user_name', userProfile.name);
            if (userProfile.picture) localStorage.setItem('user_picture', userProfile.picture);

            const targetUrl = new URL(getSafeRedirectTarget());
            if (targetUrl.origin !== window.location.origin || targetUrl.pathname.startsWith('/view/')) {
                targetUrl.searchParams.set('token', sessionToken);
                if (idToken) targetUrl.searchParams.set('fb_token', idToken);
                if (userProfile.email) targetUrl.searchParams.set('email', userProfile.email);
                if (userProfile.name) targetUrl.searchParams.set('name', userProfile.name);
            }
            window.location.replace(targetUrl.toString());
        }

        async function handleGoogleLogin() {
            const btn = document.getElementById('googleSignInBtn');
            showError('');
            if (btn) btn.disabled = true;
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await completeFirebaseSession(result.user);
            } catch (err) {
                const code = err?.code || '';
                if (
                    code === 'auth/popup-blocked' ||
                    code === 'auth/operation-not-supported-in-this-environment'
                ) {
                    await signInWithRedirect(auth, googleProvider);
                    return;
                }
                if (code === 'auth/unauthorized-domain') {
                    const fwdParams = new URLSearchParams(window.location.search);
                    if (!fwdParams.get('redirect')) fwdParams.set('redirect', `${window.location.origin}/`);
                    window.location.replace(`${FIREBASE_HOSTING_LOGIN}?${fwdParams.toString()}`);
                    return;
                } else if (code !== 'auth/popup-closed-by-user') {
                    showError(err?.message || 'Google sign-in failed.');
                }
                if (btn) btn.disabled = false;
            }
        }

        document.getElementById('googleSignInBtn')?.addEventListener('click', handleGoogleLogin);

        (async function bootstrapAuth() {
            const hash = window.location.hash || '';
            const hashMatch = hash.match(/access_token=([^&]+)/);
            const urlToken = params.get('token') || (hashMatch && hashMatch[1] ? decodeURIComponent(hashMatch[1]) : null);
            if (urlToken) {
                localStorage.setItem('access_token', urlToken);
                if (params.get('email')) localStorage.setItem('user_email', params.get('email'));
                window.location.replace(getSafeRedirectTarget());
                return;
            }

            if (loggedOut) {
                await signOut(auth).catch(() => {});
                try {
                    const cleanParams = new URLSearchParams(window.location.search);
                    cleanParams.delete('logged_out');
                    const qs = cleanParams.toString();
                    window.history.replaceState({}, document.title, qs ? `${window.location.pathname}?${qs}` : window.location.pathname);
                } catch {}
                return;
            }

            try {
                const redirectResult = await getRedirectResult(auth);
                if (redirectResult?.user) {
                    await completeFirebaseSession(redirectResult.user);
                }
            } catch (err) {
                showError(err?.message || 'Google sign-in failed.');
            }
        })();
    </script>
</body>
</html>
